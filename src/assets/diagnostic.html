<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  </head>
  <body>
    <pre id="log" style="white-space: pre-wrap; word-break: break-word; font-family: monospace; font-size: 12px; padding: 8px; margin: 0; background: #111; color: #d4ffd4;"></pre>
    <div id="container" style="width: 100%; height: 300px; background: #222;"></div>

    <script type="module">
      const logEl = document.getElementById('log');
      const log = (msg) => {
        logEl.textContent += msg + '\n';
        window.ReactNativeWebView?.postMessage(JSON.stringify({ type: 'diag', data: msg }));
      };

      const stringifyError = (err) => {
        if (err instanceof Error) return `${err.name}: ${err.message}\n${err.stack || ''}`;
        try { return JSON.stringify(err); } catch (e) { return String(err); }
      };

      const originalWarn = console.warn;
      console.warn = (...args) => {
        log('[console.warn] ' + args.map((a) => (a instanceof Error ? stringifyError(a) : String(a))).join(' '));
        originalWarn.apply(console, args);
      };
      const originalError = console.error;
      console.error = (...args) => {
        log('[console.error] ' + args.map((a) => (a instanceof Error ? stringifyError(a) : String(a))).join(' '));
        originalError.apply(console, args);
      };
      window.addEventListener('error', (e) => {
        log('[window.onerror] ' + e.message + ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno);
      });
      window.addEventListener('unhandledrejection', (e) => {
        log('[unhandledrejection] ' + stringifyError(e.reason));
      });

      const SDK_VERSION = '1.0.5';
      const HASH = 'kbae8e6c066cca4b02c2afac2bc963a643d87437a';

      log('RN-WebView diagnostic starting.');
      log('location.href = ' + location.href);
      log('document.baseURI = ' + document.baseURI);
      log('location.origin = ' + location.origin);

      const originalFetch = window.fetch;
      window.fetch = (...args) => {
        const url = typeof args[0] === 'string' ? args[0] : args[0]?.url;
        return originalFetch(...args).then((res) => {
          log('[fetch] ' + url + ' -> ' + res.status);
          return res;
        }).catch((err) => {
          log('[fetch] ' + url + ' -> THROWN ' + stringifyError(err));
          throw err;
        });
      };

      log(`Loading VisioOne ${SDK_VERSION} as ESM from CDN...`);

      import(`https://cdn.visioglobe.com/visioone/${SDK_VERSION}/dist/visioone.js`)
        .then(({ createVisioOne }) => {
          log('import() resolved OK, createVisioOne = ' + typeof createVisioOne);
          const visioOne = createVisioOne();
          log('visioOne.version = ' + visioOne.version);
          const container = document.getElementById('container');
          log('Calling loadVenue({ hash: "' + HASH + '" }, container)...');
          return visioOne
            .loadVenue({ hash: HASH }, container)
            .then((venue) => {
              log('loadVenue SUCCEEDED. venue keys: ' + Object.keys(venue).join(', '));
              return visioOne.createView(container, venue).then(() => {
                log('createView SUCCEEDED.');
              });
            })
            .catch((err) => {
              log('loadVenue/createView FAILED: ' + stringifyError(err));
            });
        })
        .catch((err) => {
          log('import() FAILED: ' + stringifyError(err));
        });
    </script>
  </body>
</html>
